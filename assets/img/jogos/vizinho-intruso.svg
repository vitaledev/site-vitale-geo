<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-vi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A192F" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Cartographic Beige Background -->
  <rect width="800" height="500" fill="#F5F2EB"/>
  <rect width="800" height="500" fill="url(#grid-vi)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#0A192F" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Topographic Radar Circles -->
  <circle cx="400" cy="240" r="175" fill="#A8C3A6" fill-opacity="0.18" stroke="#0A192F" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="400" cy="240" r="115" fill="#FAF8F4" stroke="#0A192F" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Connectors from Center Host to 4 Candidate Nodes -->
  <!-- Valid Neighbor 1 (Top-Left) -->
  <line x1="400" y1="240" x2="210" y2="135" stroke="#0A192F" stroke-width="3.5"/>
  <!-- Valid Neighbor 2 (Bottom-Left) -->
  <line x1="400" y1="240" x2="210" y2="345" stroke="#0A192F" stroke-width="3.5"/>
  <!-- Valid Neighbor 3 (Top-Right) -->
  <line x1="400" y1="240" x2="590" y2="135" stroke="#0A192F" stroke-width="3.5"/>
  <!-- Intruder Node (Bottom-Right - Broken Red Line) -->
  <line x1="400" y1="240" x2="590" y2="345" stroke="#C8102E" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Center Country Hub -->
  <circle cx="400" cy="240" r="54" fill="#0A192F" stroke="#F5F2EB" stroke-width="4"/>
  <text x="400" y="236" font-family="Orbitron, sans-serif" font-size="15" font-weight="900" fill="#F5F2EB" text-anchor="middle" letter-spacing="1">FRONTEIRA</text>
  <text x="400" y="256" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#A8C3A6" text-anchor="middle">TERRESTRE</text>

  <!-- Node 1: Valid Neighbor (Top-Left) -->
  <g transform="translate(140, 100)">
    <rect width="140" height="68" rx="12" fill="#FFFFFF" stroke="#0A192F" stroke-width="3"/>
    <circle cx="30" cy="34" r="14" fill="#A8C3A6" stroke="#0A192F" stroke-width="2"/>
    <path d="M 24 34 L 28 39 L 37 29" fill="none" stroke="#0A192F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="38" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#0A192F" text-anchor="middle">VIZINHO</text>
  </g>

  <!-- Node 2: Valid Neighbor (Bottom-Left) -->
  <g transform="translate(140, 310)">
    <rect width="140" height="68" rx="12" fill="#FFFFFF" stroke="#0A192F" stroke-width="3"/>
    <circle cx="30" cy="34" r="14" fill="#A8C3A6" stroke="#0A192F" stroke-width="2"/>
    <path d="M 24 34 L 28 39 L 37 29" fill="none" stroke="#0A192F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="38" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#0A192F" text-anchor="middle">VIZINHO</text>
  </g>

  <!-- Node 3: Valid Neighbor (Top-Right) -->
  <g transform="translate(520, 100)">
    <rect width="140" height="68" rx="12" fill="#FFFFFF" stroke="#0A192F" stroke-width="3"/>
    <circle cx="30" cy="34" r="14" fill="#A8C3A6" stroke="#0A192F" stroke-width="2"/>
    <path d="M 24 34 L 28 39 L 37 29" fill="none" stroke="#0A192F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="38" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" fill="#0A192F" text-anchor="middle">VIZINHO</text>
  </g>

  <!-- Node 4: THE INTRUDER (Bottom-Right - Crimson Alert) -->
  <g transform="translate(520, 310)">
    <rect width="140" height="68" rx="12" fill="#C8102E" stroke="#0A192F" stroke-width="3"/>
    <circle cx="30" cy="34" r="14" fill="#FFFFFF"/>
    <path d="M 25 29 L 35 39 M 35 29 L 25 39" fill="none" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="39" font-family="Orbitron, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">INTRUSO!</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="230" y="420" width="340" height="36" rx="18" fill="#0A192F"/>
  <text x="400" y="443" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#F5F2EB" text-anchor="middle" letter-spacing="1.5">CAÇADOR DE FRONTEIRAS FALSAS</text>
</svg>
