<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <!-- Fundo Bege Cartográfico -->
  <rect width="1200" height="700" fill="#F5F2EB"/>

  <!-- Curvas Topográficas Contínuas em Verde Sálvia -->
  <path d="M-40 560C160 500 320 620 520 540s280-110 440-30 190 70 280 20v190H-40V560Z" fill="#A8C3A6" opacity="0.26"/>
  <path d="M-40 140C180 90 360 190 580 120s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="2" opacity="0.55"/>
  <path d="M-40 175C190 125 370 225 590 155s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="1.5" opacity="0.35"/>

  <!-- Grade de Meridianos e Paralelos Cartográficos -->
  <g stroke="#0A192F" stroke-width="1.5" opacity="0.10">
    <path d="M0 110h1200M0 210h1200M0 310h1200M0 410h1200M0 510h1200M0 610h1200"/>
    <path d="M120 0v700M240 0v700M360 0v700M480 0v700M600 0v700M720 0v700M840 0v700M960 0v700M1080 0v700"/>
  </g>

  <!-- Telemetria Superior -->
  <text x="80" y="135" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="4">VITALEGEO · TOPOLOGIA TERRITORIAL</text>

  <!-- Tipografia Monumental à Esquerda -->
  <text x="72" y="340" fill="#0A192F" font-family="'Orbitron', Arial, sans-serif" font-size="180" font-weight="900" letter-spacing="-4">07</text>
  <text x="80" y="405" fill="#0A192F" font-family="'Montserrat', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="0.5">FRONTEIRAS TERRESTRES</text>
  <text x="80" y="446" fill="#53647C" font-family="'Montserrat', Arial, sans-serif" font-size="22" font-weight="600">Menor caminho entre quaisquer dois países</text>

  <!-- Rede Geodésica de Fronteiras à Direita -->
  <g transform="translate(875, 345)">
    <!-- Anel Ortométrico de Fundo -->
    <circle cx="0" cy="0" r="220" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.22"/>
    <circle cx="0" cy="0" r="160" stroke="#A8C3A6" stroke-width="2" opacity="0.45"/>

    <!-- Conexões Secundárias de Adjacência -->
    <g stroke="#53647C" stroke-width="2" stroke-dasharray="4 5" opacity="0.45">
      <line x1="-185" y1="85" x2="-120" y2="-45"/>
      <line x1="-95" y1="15" x2="-40" y2="115"/>
      <line x1="-5" y1="-85" x2="70" y2="-155"/>
      <line x1="95" y1="-25" x2="150" y2="75"/>
      <line x1="-40" y1="115" x2="95" y2="-25"/>
    </g>

    <!-- Caminho Mínimo Principal (Origem -> Intermediários -> Destino) -->
    <path d="M -185 85 L -95 15 L -5 -85 L 95 -25 L 185 -115" stroke="#0A192F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -185 85 L -95 15 L -5 -85 L 95 -25 L 185 -115" stroke="#F5F2EB" stroke-width="1.5" stroke-dasharray="6 8" stroke-linecap="round"/>

    <!-- Nós Secundários -->
    <circle cx="-120" cy="-45" r="7" fill="#F5F2EB" stroke="#53647C" stroke-width="2.5"/>
    <circle cx="-40" cy="115" r="7" fill="#F5F2EB" stroke="#53647C" stroke-width="2.5"/>
    <circle cx="70" cy="-155" r="7" fill="#F5F2EB" stroke="#53647C" stroke-width="2.5"/>
    <circle cx="150" cy="75" r="7" fill="#F5F2EB" stroke="#53647C" stroke-width="2.5"/>

    <!-- Nó Origem (Azul Marinho) -->
    <circle cx="-185" cy="85" r="24" fill="#0A192F" stroke="#F5F2EB" stroke-width="4"/>
    <circle cx="-185" cy="85" r="8" fill="#F5F2EB"/>
    <text x="-185" y="132" fill="#0A192F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">ORIGEM</text>

    <!-- Nós Intermediários (Verde Sálvia com Borda Marinho) -->
    <circle cx="-95" cy="15" r="15" fill="#A8C3A6" stroke="#0A192F" stroke-width="3.5"/>
    <circle cx="-5" cy="-85" r="15" fill="#A8C3A6" stroke="#0A192F" stroke-width="3.5"/>
    <circle cx="95" cy="-25" r="15" fill="#A8C3A6" stroke="#0A192F" stroke-width="3.5"/>

    <!-- Nó Destino (Vermelho Destaque com Anel Marinho) -->
    <circle cx="185" cy="-115" r="26" fill="#C8102E" stroke="#0A192F" stroke-width="4"/>
    <circle cx="185" cy="-115" r="9" fill="#F5F2EB"/>
    <text x="185" y="-154" fill="#C8102E" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">DESTINO</text>
  </g>

  <!-- Bússola Minimalista Superior Direita -->
  <g transform="translate(1105, 85)">
    <circle cx="0" cy="0" r="26" stroke="#0A192F" stroke-width="1.5" opacity="0.35"/>
    <polygon points="0,-20 5,0 0,20 -5,0" fill="#0A192F"/>
    <polygon points="0,-20 5,0 -5,0" fill="#C8102E"/>
    <text x="0" y="-26" fill="#C8102E" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" text-anchor="middle">N</text>
  </g>

  <!-- Rodapé Editorial -->
  <text x="80" y="625" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" letter-spacing="3">GRAUS DE SEPARAÇÃO &amp; ROTA TERRESTRE</text>
</svg>
