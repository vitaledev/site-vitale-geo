<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-ct" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A192F" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Cartographic Beige Background -->
  <rect width="800" height="500" fill="#F5F2EB"/>
  <rect width="800" height="500" fill="url(#grid-ct)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#0A192F" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Abstract Continental Landmass Silhouette -->
  <path d="M 85 280 Q 150 180 260 210 T 460 170 T 630 220 T 720 150 L 730 340 Q 580 390 420 330 T 120 350 Z" fill="#A8C3A6" fill-opacity="0.28" stroke="#0A192F" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Graph Network Background Edges (Alternative Paths) -->
  <g stroke="#0A192F" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <path d="M 140 300 L 250 170 L 410 140 L 570 160 L 670 190"/>
    <path d="M 140 300 L 290 340 L 470 320 L 670 190"/>
    <path d="M 250 170 L 310 260 L 470 320"/>
    <path d="M 410 140 L 490 230 L 570 160"/>
  </g>

  <!-- Shortest Path Highlight (BFS Route) -->
  <path d="M 140 300 L 310 260 L 490 230 L 670 190" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes along Shortest Path -->
  <!-- Origin Node (A) -->
  <circle cx="140" cy="300" r="22" fill="#0A192F" stroke="#F5F2EB" stroke-width="4"/>
  <text x="140" y="305" font-family="Orbitron, sans-serif" font-size="14" font-weight="900" fill="#F5F2EB" text-anchor="middle">A</text>
  <rect x="90" y="332" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#0A192F" stroke-width="2"/>
  <text x="140" y="349" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">ORIGEM</text>

  <!-- Hop 1 -->
  <circle cx="310" cy="260" r="16" fill="#C8102E" stroke="#F5F2EB" stroke-width="3.5"/>
  <text x="310" y="265" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- Hop 2 -->
  <circle cx="490" cy="230" r="16" fill="#C8102E" stroke="#F5F2EB" stroke-width="3.5"/>
  <text x="490" y="235" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Destination Node (B) -->
  <circle cx="670" cy="190" r="22" fill="#0A192F" stroke="#F5F2EB" stroke-width="4"/>
  <text x="670" y="195" font-family="Orbitron, sans-serif" font-size="14" font-weight="900" fill="#F5F2EB" text-anchor="middle">B</text>
  <rect x="620" y="222" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#0A192F" stroke-width="2"/>
  <text x="670" y="239" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">DESTINO</text>

  <!-- Secondary Non-optimal Nodes -->
  <circle cx="250" cy="170" r="9" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>
  <circle cx="410" cy="140" r="9" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>
  <circle cx="570" cy="160" r="9" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>
  <circle cx="290" cy="340" r="9" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>
  <circle cx="470" cy="320" r="9" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>

  <!-- Top Telemetry Badge -->
  <rect x="235" y="54" width="330" height="40" rx="10" fill="#FAF8F4" stroke="#0A192F" stroke-width="2.5"/>
  <text x="400" y="79" font-family="Orbitron, sans-serif" font-size="14" font-weight="900" fill="#0A192F" text-anchor="middle" letter-spacing="1">MENOR CAMINHO TERRESTRE</text>

  <!-- Bottom Banner -->
  <rect x="210" y="415" width="380" height="36" rx="18" fill="#0A192F"/>
  <text x="400" y="438" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#F5F2EB" text-anchor="middle" letter-spacing="1.2">GRAFO DE FRONTEIRAS • BUSCA BFS</text>
</svg>
