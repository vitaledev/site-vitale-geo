<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <!-- Fundo Bege Cartográfico -->
  <rect width="1200" height="700" fill="#F5F2EB"/>

  <!-- Curvas Topográficas Contínuas em Verde Sálvia -->
  <path d="M-40 560C160 500 320 620 520 540s280-110 440-30 190 70 280 20v190H-40V560Z" fill="#A8C3A6" opacity="0.26"/>
  <path d="M-40 140C180 90 360 190 580 120s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="2" opacity="0.55"/>
  <path d="M-40 175C190 125 370 225 590 155s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="1.5" opacity="0.35"/>

  <!-- Grade de Meridianos e Paralelos Cartográficos -->
  <g stroke="#0A192F" stroke-width="1.5" opacity="0.10">
    <path d="M0 110h1200M0 210h1200M0 310h1200M0 410h1200M0 510h1200M0 610h1200"/>
    <path d="M120 0v700M240 0v700M360 0v700M480 0v700M600 0v700M720 0v700M840 0v700M960 0v700M1080 0v700"/>
  </g>

  <!-- Telemetria Superior -->
  <text x="80" y="135" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="4">VITALEGEO · MOBILIDADE &amp; DIPLOMACIA</text>

  <!-- Tipografia Monumental à Esquerda -->
  <text x="72" y="336" fill="#0A192F" font-family="'Orbitron', Arial, sans-serif" font-size="144" font-weight="900" letter-spacing="-4">19<tspan fill="#C8102E">8</tspan></text>
  <text x="80" y="405" fill="#0A192F" font-family="'Montserrat', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">FORÇA DE PASSAPORTES</text>
  <text x="80" y="446" fill="#53647C" font-family="'Montserrat', Arial, sans-serif" font-size="22" font-weight="600">Isenção de vistos e dupla cidadania no mapa</text>

  <!-- Diagrama Técnico de Passaporte & Matriz Consular à Direita -->
  <g transform="translate(885, 345)">
    <!-- Anéis de Mira Técnica -->
    <circle cx="0" cy="0" r="222" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.22"/>
    <circle cx="0" cy="0" r="172" stroke="#A8C3A6" stroke-width="2" opacity="0.45"/>

    <!-- Passaporte Secundário (Fundo - Vermelho Destaque / Dupla Cidadania) -->
    <g transform="translate(-30, -125) rotate(8)">
      <rect x="6" y="8" width="150" height="214" rx="14" fill="#0A192F" opacity="0.14"/>
      <rect x="0" y="0" width="150" height="214" rx="14" fill="#C8102E" stroke="#0A192F" stroke-width="3.5"/>
      <rect x="14" y="14" width="122" height="186" rx="8" stroke="#F5F2EB" stroke-width="1.5" stroke-opacity="0.45"/>
      <!-- Globo Geométrico -->
      <circle cx="75" cy="96" r="32" stroke="#F5F2EB" stroke-width="2.2"/>
      <ellipse cx="75" cy="96" rx="16" ry="32" stroke="#F5F2EB" stroke-width="1.6"/>
      <line x1="43" y1="96" x2="107" y2="96" stroke="#F5F2EB" stroke-width="1.6"/>
      <!-- Chip Biométrico -->
      <rect x="57" y="156" width="36" height="22" rx="4" stroke="#F5F2EB" stroke-width="2"/>
      <circle cx="75" cy="167" r="4.5" stroke="#F5F2EB" stroke-width="1.8"/>
      <line x1="57" y1="167" x2="70" y2="167" stroke="#F5F2EB" stroke-width="1.8"/>
      <line x1="80" y1="167" x2="93" y2="167" stroke="#F5F2EB" stroke-width="1.8"/>
    </g>

    <!-- Passaporte Principal (Frente - Azul Marinho) -->
    <g transform="translate(-145, -108)">
      <rect x="8" y="10" width="166" height="236" rx="16" fill="#0A192F" opacity="0.18"/>
      <rect x="0" y="0" width="166" height="236" rx="16" fill="#0A192F" stroke="#0A192F" stroke-width="3.5"/>
      <rect x="14" y="14" width="138" height="208" rx="9" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="83" y="44" fill="#F5F2EB" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle">PASSPORT</text>
      <!-- Globo Geodésico Central -->
      <circle cx="83" cy="108" r="38" stroke="#A8C3A6" stroke-width="2.5"/>
      <ellipse cx="83" cy="108" rx="19" ry="38" stroke="#A8C3A6" stroke-width="1.8"/>
      <line x1="45" y1="108" x2="121" y2="108" stroke="#A8C3A6" stroke-width="1.8"/>
      <path d="M51 89h64M51 127h64" stroke="#A8C3A6" stroke-width="1.5" opacity="0.7"/>
      <!-- Selo Biométrico -->
      <rect x="61" y="172" width="44" height="26" rx="5" stroke="#F5F2EB" stroke-width="2.2"/>
      <circle cx="83" cy="185" r="5.5" stroke="#C8102E" stroke-width="2.2"/>
      <line x1="61" y1="185" x2="77" y2="185" stroke="#F5F2EB" stroke-width="2"/>
      <line x1="89" y1="185" x2="105" y2="185" stroke="#F5F2EB" stroke-width="2"/>
    </g>

    <!-- Carimbo de Isenção em Verde Sálvia -->
    <g transform="translate(88, 92) rotate(-12)">
      <circle cx="0" cy="0" r="46" fill="#F5F2EB" stroke="#0A192F" stroke-width="3"/>
      <circle cx="0" cy="0" r="38" fill="#A8C3A6" fill-opacity="0.35" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="0" y="-4" fill="#0A192F" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">SEM</text>
      <text x="0" y="13" fill="#C8102E" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">VISTO</text>
    </g>
  </g>

  <!-- Bússola Minimalista Superior Direita -->
  <g transform="translate(1105, 85)">
    <circle cx="0" cy="0" r="26" stroke="#0A192F" stroke-width="1.5" opacity="0.35"/>
    <polygon points="0,-20 5,0 0,20 -5,0" fill="#0A192F"/>
    <polygon points="0,-20 5,0 -5,0" fill="#C8102E"/>
    <text x="0" y="-26" fill="#C8102E" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" text-anchor="middle">N</text>
  </g>

  <!-- Rodapé Editorial -->
  <text x="80" y="625" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" letter-spacing="3">RECIPROCIDADE CONSULAR &amp; ÍNDICE GLOBAL</text>
</svg>
