<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-ce" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A192F" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fundo Bege Cartográfico Oficial -->
  <rect width="800" height="500" fill="#F5F2EB"/>
  <rect width="800" height="500" fill="url(#grid-ce)"/>

  <!-- Curvas Topográficas Contínuas de Canto (Verde Sálvia) -->
  <g fill="none" stroke="#A8C3A6" stroke-width="1.5" opacity="0.48">
    <circle cx="0" cy="0" r="145"/>
    <circle cx="0" cy="0" r="205"/>
    <circle cx="800" cy="500" r="150"/>
    <circle cx="800" cy="500" r="215"/>
  </g>

  <!-- Moldura Externa -->
  <rect x="24" y="24" width="752" height="452" rx="16" fill="none" stroke="#0A192F" stroke-width="2" stroke-opacity="0.18"/>

  <!-- Cabeçalho Minimalista da Arte -->
  <text x="400" y="68" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#53647C" text-anchor="middle" letter-spacing="3">RADAR GEOPOLÍTICO • 15S</text>
  <text x="400" y="102" font-family="Orbitron, sans-serif" font-size="27" font-weight="900" fill="#0A192F" text-anchor="middle" letter-spacing="1.5">CAÇA AO <tspan fill="#C8102E">ENCLAVE</tspan></text>

  <!-- Quadro Cartográfico Central -->
  <g transform="translate(150, 126)">
    <rect x="0" y="0" width="500" height="270" rx="18" fill="#FFFFFF" stroke="#0A192F" stroke-width="2" stroke-opacity="0.18"/>

    <!-- Território Envolvente em Verde Sálvia suave -->
    <path d="M 48 48 L 210 34 L 350 54 L 456 42 L 466 170 L 420 236 L 260 226 L 130 242 L 42 182 Z"
          fill="#A8C3A6" fill-opacity="0.28" stroke="#0A192F" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Linhas de Fronteira Interna (Divisão Regional) -->
    <path d="M 42 140 Q 120 124 180 156 T 310 132 T 464 146"
          fill="none" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.35"/>
    <path d="M 190 36 Q 204 115 178 188 L 160 238"
          fill="none" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.35"/>

    <!-- Polígono do Enclave Isolado (Vermelho Destaque) -->
    <path d="M 222 104 L 274 96 L 296 128 L 280 168 L 230 162 L 212 132 Z"
          fill="#C8102E" fill-opacity="0.18" stroke="#C8102E" stroke-width="3" stroke-linejoin="round"/>

    <!-- Anéis de Radar e Mira Geodésica Centrados no Enclave (254, 134) -->
    <circle cx="254" cy="134" r="56" fill="none" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.45"/>
    <circle cx="254" cy="134" r="88" fill="none" stroke="#C8102E" stroke-width="1.2" stroke-opacity="0.32"/>

    <!-- Cruzeta da Mira -->
    <line x1="184" y1="134" x2="232" y2="134" stroke="#0A192F" stroke-width="2"/>
    <line x1="276" y1="134" x2="324" y2="134" stroke="#0A192F" stroke-width="2"/>
    <line x1="254" y1="64" x2="254" y2="112" stroke="#0A192F" stroke-width="2"/>
    <line x1="254" y1="156" x2="254" y2="204" stroke="#0A192F" stroke-width="2"/>

    <!-- Ponto Central do Alvo -->
    <circle cx="254" cy="134" r="7" fill="#C8102E" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Etiqueta de Telemetria no Canto do Mapa -->
    <rect x="20" y="20" width="136" height="24" rx="12" fill="#0A192F"/>
    <text x="88" y="36" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#F5F2EB" text-anchor="middle">ALVO ISOLADO</text>

    <rect x="336" y="224" width="144" height="24" rx="12" fill="#F5F2EB" stroke="#0A192F" stroke-width="1.2" stroke-opacity="0.25"/>
    <text x="408" y="240" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#0A192F" text-anchor="middle">51.44° N · 4.93° E</text>
  </g>

  <!-- Barra Inferior -->
  <rect x="195" y="422" width="410" height="34" rx="17" fill="#0A192F"/>
  <text x="400" y="443" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#F5F2EB" text-anchor="middle" letter-spacing="1.2">ENCLAVES • EXCLAVES • ANOMALIAS</text>
</svg>
