<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <!-- Fundo Bege Cartográfico -->
  <rect width="1200" height="700" fill="#F5F2EB"/>

  <!-- Curvas Topográficas Contínuas em Verde Sálvia -->
  <path d="M-40 560C160 500 320 620 520 540s280-110 440-30 190 70 280 20v190H-40V560Z" fill="#A8C3A6" opacity="0.26"/>
  <path d="M-40 140C180 90 360 190 580 120s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="2" opacity="0.55"/>
  <path d="M-40 175C190 125 370 225 590 155s290-60 440 20 150 50 220 10" stroke="#A8C3A6" stroke-width="1.5" opacity="0.35"/>

  <!-- Grade de Meridianos e Paralelos Cartográficos -->
  <g stroke="#0A192F" stroke-width="1.5" opacity="0.10">
    <path d="M0 110h1200M0 210h1200M0 310h1200M0 410h1200M0 510h1200M0 610h1200"/>
    <path d="M120 0v700M240 0v700M360 0v700M480 0v700M600 0v700M720 0v700M840 0v700M960 0v700M1080 0v700"/>
  </g>

  <!-- Telemetria Superior -->
  <text x="80" y="135" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="4">VITALEGEO · INFRAESTRUTURA &amp; VIAGENS</text>

  <!-- Tipografia Monumental à Esquerda -->
  <text x="72" y="336" fill="#0A192F" font-family="'Orbitron', Arial, sans-serif" font-size="146" font-weight="900" letter-spacing="-4">220<tspan fill="#C8102E">V</tspan></text>
  <text x="80" y="405" fill="#0A192F" font-family="'Montserrat', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">TOMADAS &amp; VOLTAGEM</text>
  <text x="80" y="446" fill="#53647C" font-family="'Montserrat', Arial, sans-serif" font-size="22" font-weight="600">Padrões elétricos e adaptadores em 198 países</text>

  <!-- Diagrama Técnico de Tomadas IEC à Direita -->
  <g transform="translate(880, 345)">
    <!-- Anéis de Mira Técnica -->
    <circle cx="0" cy="0" r="222" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.22"/>
    <circle cx="0" cy="0" r="172" stroke="#A8C3A6" stroke-width="2" opacity="0.45"/>

    <!-- Placa Esquerda: Padrão N (Brasil / IEC 60906-1) -->
    <g transform="translate(-145, -86)">
      <rect x="6" y="8" width="132" height="172" rx="14" fill="#0A192F" opacity="0.12"/>
      <rect x="0" y="0" width="132" height="172" rx="14" fill="#FFFFFF" stroke="#0A192F" stroke-width="3.5"/>
      <!-- Poço Hexagonal Tipo N -->
      <polygon points="34,36 98,36 112,72 98,108 34,108 20,72" fill="#F5F2EB" stroke="#0A192F" stroke-width="2.5"/>
      <!-- Pinos Tipo N -->
      <circle cx="42" cy="72" r="7" fill="#0A192F"/>
      <circle cx="90" cy="72" r="7" fill="#0A192F"/>
      <circle cx="66" cy="54" r="7" fill="#C8102E"/>
      <!-- Rótulo Técnico -->
      <text x="66" y="138" fill="#0A192F" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">TIPO N</text>
      <text x="66" y="156" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">127/220V · 60Hz</text>
    </g>

    <!-- Placa Direita: Padrão B/G Comparado -->
    <g transform="translate(15, -86)">
      <rect x="6" y="8" width="132" height="172" rx="14" fill="#0A192F" opacity="0.12"/>
      <rect x="0" y="0" width="132" height="172" rx="14" fill="#0A192F" stroke="#0A192F" stroke-width="3.5"/>
      <!-- Soquete Circular -->
      <circle cx="66" cy="72" r="42" fill="#F5F2EB" stroke="#A8C3A6" stroke-width="2.5"/>
      <!-- Pinos Retangulares Tipo G -->
      <rect x="61" y="42" width="10" height="20" rx="2" fill="#C8102E"/>
      <rect x="38" y="79" width="18" height="10" rx="2" fill="#0A192F"/>
      <rect x="76" y="79" width="18" height="10" rx="2" fill="#0A192F"/>
      <!-- Rótulo Técnico -->
      <text x="66" y="138" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" text-anchor="middle">TIPO G</text>
      <text x="66" y="156" fill="#A8C3A6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">230V · 50Hz</text>
    </g>

    <!-- Conexão Central de Adaptador -->
    <line x1="-13" y1="0" x2="15" y2="0" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1" cy="0" r="14" fill="#C8102E" stroke="#F5F2EB" stroke-width="3"/>
    <path d="M-4 0h10M2 -4l4 4-4 4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bússola Minimalista Superior Direita -->
  <g transform="translate(1105, 85)">
    <circle cx="0" cy="0" r="26" stroke="#0A192F" stroke-width="1.5" opacity="0.35"/>
    <polygon points="0,-20 5,0 0,20 -5,0" fill="#0A192F"/>
    <polygon points="0,-20 5,0 -5,0" fill="#C8102E"/>
    <text x="0" y="-26" fill="#C8102E" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" text-anchor="middle">N</text>
  </g>

  <!-- Rodapé Editorial -->
  <text x="80" y="625" fill="#53647C" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" letter-spacing="3">PADRÕES IEC A–O &amp; COMPATIBILIDADE GLOBAL</text>
</svg>
