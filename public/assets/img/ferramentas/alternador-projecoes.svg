<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Fundo Bege Cartográfico -->
  <rect width="800" height="450" fill="#F5F2EB"/>
  
  <!-- Curvas de Nível Topográficas Sutis -->
  <path d="M-50 120 Q 200 60, 450 140 T 850 90" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M-50 180 Q 220 110, 480 200 T 850 150" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M-50 320 Q 240 260, 520 340 T 850 280" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  
  <!-- Moldura Graduada Externa -->
  <rect x="24" y="24" width="752" height="402" rx="16" fill="#0A192F" stroke="#0A192F" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="394" rx="12" fill="#0D1E38"/>
  
  <!-- Grid Graticule Cartográfica -->
  <g stroke="#53647C" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.35">
    <line x1="80" y1="225" x2="720" y2="225"/>
    <line x1="80" y1="145" x2="720" y2="145"/>
    <line x1="80" y1="305" x2="720" y2="305"/>
    <line x1="400" y1="70" x2="400" y2="380"/>
    <line x1="240" y1="70" x2="240" y2="380"/>
    <line x1="560" y1="70" x2="560" y2="380"/>
  </g>

  <!-- Globo / Elipse Central Projetada -->
  <ellipse cx="400" cy="225" rx="280" ry="155" stroke="#A8C3A6" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.6"/>
  <ellipse cx="400" cy="225" rx="190" ry="155" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.4"/>
  <ellipse cx="400" cy="225" rx="100" ry="155" stroke="#A8C3A6" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Indicatrizes de Tissot (Círculos & Elipses de Distorção) -->
  <!-- Equador (Círculos perfeitos) -->
  <circle cx="400" cy="225" r="16" fill="#C8102E" fill-opacity="0.3" stroke="#C8102E" stroke-width="1.5"/>
  <circle cx="280" cy="225" r="16" fill="#C8102E" fill-opacity="0.25" stroke="#C8102E" stroke-width="1.5"/>
  <circle cx="520" cy="225" r="16" fill="#C8102E" fill-opacity="0.25" stroke="#C8102E" stroke-width="1.5"/>
  
  <!-- Trópicos (Leves elipses) -->
  <ellipse cx="340" cy="165" rx="20" ry="15" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="460" cy="165" rx="20" ry="15" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="340" cy="285" rx="20" ry="15" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="460" cy="285" rx="20" ry="15" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Polos (Elipses de deformação extrema) -->
  <ellipse cx="400" cy="100" rx="36" ry="12" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>
  <ellipse cx="400" cy="350" rx="36" ry="12" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Rosa dos Ventos Minimalista no Canto -->
  <g transform="translate(680, 80) scale(0.6)">
    <circle cx="0" cy="0" r="32" stroke="#53647C" stroke-width="1.5" fill="none" opacity="0.4"/>
    <polygon points="0,-28 6,-6 28,0 6,6 0,28 -6,6 -28,0 -6,-6" fill="#0A192F" stroke="#A8C3A6" stroke-width="1"/>
    <polygon points="0,-28 6,-6 0,0" fill="#C8102E"/>
    <text x="0" y="-34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#C8102E" text-anchor="middle">N</text>
  </g>

  <!-- Barra de Escala WGS84 -->
  <g transform="translate(60, 390)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="80" y1="-3" x2="80" y2="3" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="160" y1="-5" x2="160" y2="5" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A8C3A6">0</text>
    <text x="80" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A8C3A6" text-anchor="middle">5.000 km</text>
    <text x="160" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A8C3A6" text-anchor="end">10.000 km</text>
  </g>

  <!-- Tipografia Editorial Central da Capa -->
  <text x="400" y="60" font-family="'Orbitron', sans-serif" font-size="13" font-weight="800" fill="#C8102E" letter-spacing="3" text-anchor="middle">LABORATÓRIO CARTOGRÁFICO // VITALEGEO</text>
  
  <rect x="180" y="325" width="440" height="52" rx="10" fill="#0A192F" fill-opacity="0.9" stroke="#C8102E" stroke-width="1.5"/>
  <text x="400" y="356" font-family="'Orbitron', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">ALTERNADOR DE PROJEÇÕES</text>
</svg>
