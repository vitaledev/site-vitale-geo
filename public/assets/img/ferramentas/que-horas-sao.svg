<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none">
  <!-- Fundo Bege Cartográfico -->
  <rect width="1200" height="700" fill="#F5F2EB"/>
  
  <!-- Curva Topográfica em Verde Sálvia -->
  <path d="M0 580C160 520 280 630 460 560s280-90 420-20 200 65 320 10v150H0V580Z" fill="#A8C3A6" opacity=".28"/>
  
  <!-- Grade de Meridianos e Paralelos Cartográficos -->
  <g stroke="#0A192F" stroke-width="2" opacity=".12">
    <path d="M0 120h1200M0 210h1200M0 300h1200M0 390h1200M0 480h1200M0 570h1200"/>
    <path d="M120 0v700M240 0v700M360 0v700M480 0v700M600 0v700M720 0v700M840 0v700M960 0v700M1080 0v700"/>
  </g>
  
  <!-- Tipografia e Telemetria Editorial -->
  <text x="80" y="145" fill="#53647C" font-family="monospace" font-size="20" letter-spacing="4">VITALEGEO · CRONOMETRIA GLOBAL &amp; FUSOS</text>
  
  <text x="75" y="385" fill="#0A192F" font-family="'Orbitron', Arial, sans-serif" font-size="230" font-weight="900" letter-spacing="-4">198</text>
  <text x="85" y="450" fill="#0A192F" font-family="'Montserrat', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1">PAÍSES EM TEMPO REAL</text>
  
  <!-- Bússola e Globo de Fusos Horários à Direita -->
  <g transform="translate(900, 350)">
    <!-- Círculo Externo e Graduações de 24h -->
    <circle cx="0" cy="0" r="210" stroke="#0A192F" stroke-width="3" fill="none"/>
    <circle cx="0" cy="0" r="185" stroke="#A8C3A6" stroke-width="14" fill="none" opacity=".8"/>
    <circle cx="0" cy="0" r="150" stroke="#0A192F" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity=".3"/>

    <!-- Meridianos do Globo Interno -->
    <ellipse cx="0" cy="0" rx="90" ry="150" stroke="#0A192F" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".35"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#0A192F" stroke-width="2" opacity=".4"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#0A192F" stroke-width="2" opacity=".4"/>

    <!-- Ponteiros do Fuso em Vermelho Destaque -->
    <path d="M0 0 L0 -135" stroke="#C8102E" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 0 L85 45" stroke="#0A192F" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#0A192F"/>
    <circle cx="0" cy="0" r="6" fill="#F5F2EB"/>

    <!-- Marcadores Cardinais de Tempo (0h, 6h, 12h, 18h) -->
    <circle cx="0" cy="-185" r="7" fill="#C8102E"/>
    <circle cx="185" cy="0" r="6" fill="#0A192F"/>
    <circle cx="0" cy="185" r="6" fill="#0A192F"/>
    <circle cx="-185" cy="0" r="6" fill="#0A192F"/>
    
    <text x="-12" y="-195" fill="#C8102E" font-family="monospace" font-size="14" font-weight="700">UTC</text>
    <text x="195" y="5" fill="#53647C" font-family="monospace" font-size="13">+6h</text>
    <text x="-14" y="208" fill="#53647C" font-family="monospace" font-size="13">12h</text>
    <text x="-230" y="5" fill="#53647C" font-family="monospace" font-size="13">-6h</text>
  </g>
  
  <text x="80" y="625" fill="#53647C" font-family="monospace" font-size="21" letter-spacing="3">CONVERSÃO INSTANTÂNEA &amp; DELTA DE HORÁRIO</text>
</svg>
