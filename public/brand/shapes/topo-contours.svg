  <path d="M 246 180 L 254 180 M 250 176 L 250 184" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-linecap="round"/>
  <text x="260" y="184" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C8102E">▲ 945m</text>

  <!-- Cume Secundário Sul -->
