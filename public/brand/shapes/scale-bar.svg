<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" fill="none">
  <!-- Título Superior -->
  <text x="50" y="22" font-family="'Orbitron', sans-serif" font-size="10" font-weight="700" fill="#0A192F" letter-spacing="0.12em">ESCALA CARTOGRÁFICA EDITORIAL</text>
  <text x="550" y="22" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="500" fill="#53647C">PROJEÇÃO PADRÃO // WGS 84</text>

  <g transform="translate(0, 42)">
    <!-- Segmento 0-50 (Azul Marinho) -->
    <rect x="50" y="16" width="50" height="10" fill="#0A192F"/>
    <!-- Segmento 50-100 (Bege) -->
    <rect x="100" y="16" width="50" height="10" fill="#F5F2EB" stroke="#0A192F" stroke-width="1.2"/>
    <!-- Segmento 100-250 (Azul Marinho) -->
    <rect x="150" y="16" width="150" height="10" fill="#0A192F"/>
    <!-- Segmento 250-500 (Bege) -->
    <rect x="300" y="16" width="250" height="10" fill="#F5F2EB" stroke="#0A192F" stroke-width="1.2"/>

    <!-- Ticks Verticais Superiores (Km) -->
    <line x1="50" y1="8" x2="50" y2="30" stroke="#0A192F" stroke-width="1.8"/>
    <line x1="100" y1="11" x2="100" y2="26" stroke="#0A192F" stroke-width="1.2"/>
    <line x1="150" y1="8" x2="150" y2="30" stroke="#0A192F" stroke-width="1.8"/>
    <line x1="300" y1="8" x2="300" y2="30" stroke="#0A192F" stroke-width="1.8"/>
    <line x1="550" y1="8" x2="550" y2="30" stroke="#0A192F" stroke-width="1.8"/>

    <!-- Valores em Km -->
    <text x="50" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0A192F">0</text>
    <text x="100" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0A192F">50</text>
    <text x="150" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0A192F">100</text>
    <text x="300" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0A192F">250</text>
    <text x="550" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0A192F">500 km</text>

    <!-- Subdivisão Inferior em Milhas Náuticas (NM) -->
    <line x1="50" y1="38" x2="513" y2="38" stroke="#0A192F" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="50" y1="34" x2="50" y2="42" stroke="#0A192F" stroke-width="1.2"/>
    <text x="50" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#53647C">0</text>
    <line x1="235" y1="34" x2="235" y2="42" stroke="#0A192F" stroke-width="1.2"/>
    <text x="235" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#53647C">100</text>
    <line x1="513" y1="34" x2="513" y2="42" stroke="#0A192F" stroke-width="1.2"/>
    <text x="513" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#53647C">250 NM</text>
  </g>
</svg>
