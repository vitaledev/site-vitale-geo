<!DOCTYPE html>
<html lang="pt-br" class="bg-[#07080d]">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="canonical" href="https://www.vitalegeo.com.br/jogos/bandeiras/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operação Bandeira | Arcade VitaleGeo</title>
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="alternate" type="application/rss+xml" title="VitaleGeo | Feed RSS" href="https://www.vitalegeo.com.br/rss.xml">
    <meta name="description" content="Teste seus reflexos e conhecimentos identificando as bandeiras de mais de 70 países do mundo em modo arcade.">
    <meta name="keywords" content="bandeiras, geografia, jogo, quiz, países, vitalegeo">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="arcade-shell text-slate-200 select-none">

    <!-- BARRA DEDICADA DO ARCADE (Ambiente isolado do site) -->
    <header class="arcade-header">
        <a href="/jogos" class="arcade-header__exit" title="Voltar para a central de simulações">
            <i class="ph-bold ph-arrow-left"></i>
            <span>Central de Jogos</span>
        </a>

        <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></div>
            <span class="font-heading font-bold text-sm tracking-tight text-white sm:text-base">
                Operação <span class="text-amber-400">Bandeira</span>
            </span>
        </div>

        <div class="arcade-header__actions">
            <button onclick="alternarTelaCheia()" id="btn-fullscreen" class="arcade-btn-action" title="Modo Tela Cheia">
                <i class="ph-bold ph-arrows-out-simple text-sm"></i>
                <span class="hidden sm:inline">Tela Cheia</span>
            </button>
        </div>
    </header>

    <!-- PALCO CENTRAL PROTEGIDO (The Stage - Sem invasão de anúncios) -->
    <main class="arcade-stage-wrapper" id="game-stage-container">
        
        <div class="arcade-stage p-5 sm:p-8 max-w-xl mx-auto flex flex-col items-center justify-between text-center min-h-[480px]">
            
            <!-- Barra de Status do Jogador -->
            <div class="w-full flex items-center justify-between border-b border-white/5 pb-4 mb-4">
                <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
                    <i class="ph-fill ph-flame text-amber-400 text-sm"></i>
                    <span>Streak: <strong id="score" class="text-amber-400 text-sm">0</strong></span>
                </div>
                <div class="text-[11px] font-mono text-slate-500 uppercase tracking-widest">
                    Round Rápido
                </div>
                <div class="text-xs font-mono text-slate-400">
                    <span>Recorde: <strong id="best-score" class="text-emerald-400 text-sm">0</strong></span>
                </div>
            </div>

            <!-- Moldura da Bandeira (Carregamento Local Seguro) -->
            <div class="my-auto flex flex-col items-center">
                <p class="text-[11px] font-mono uppercase tracking-widest text-slate-500 mb-3">Qual é este país?</p>
                
                <div class="w-64 h-40 sm:w-72 sm:h-44 bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-white/10 flex items-center justify-center relative p-1.5 bg-gradient-to-b from-white/5 to-transparent">
                    <img id="flag-img" src="" class="w-full h-full object-cover rounded-xl shadow-inner transition-transform duration-300 hover:scale-105" alt="Bandeira do País">
                </div>

                <div id="feedback" class="h-6 mt-3 text-xs font-mono font-bold uppercase tracking-wider text-slate-500">
                    Selecione uma opção abaixo
                </div>
            </div>

            <!-- Grade de Opções (4 Alternativas Táteis) -->
            <div id="options-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full mt-4">
                <!-- Preenchido via JavaScript -->
            </div>

        </div>

        <!-- ZONA SEGURA DE ANÚNCIOS (Abaixo do Palco - Não quebra os cliques do jogo) -->
        <div class="arcade-ad-zone">
            <span>PUBLICIDADE RESERVADA · VITALEGEO ARCADE</span>
            <!-- Bloco AdSense aqui, completamente fora dos botões de resposta -->
        </div>

    </main>

    <!-- Rodapé Minimalista do Arcade -->
    <footer class="py-3 px-6 text-center text-[11px] font-mono text-slate-600 border-t border-white/5">
        VitaleGeo Arcade &copy; 2026 · Ambiente Otimizado de Jogo
    </footer>

    <!-- Lógica do Jogo com Assets Locais e Confetes -->
    <script>
        // Banco Enriquecido com mais de 70 países usando as bandeiras baixadas localmente (/assets/flags/)
        const allCountries = [
            { name: "Brasil", code: "br" },
            { name: "Portugal", code: "pt" },
            { name: "Estados Unidos", code: "us" },
            { name: "Canadá", code: "ca" },
            { name: "Reino Unido", code: "gb" },
            { name: "Alemanha", code: "de" },
            { name: "França", code: "fr" },
            { name: "Itália", code: "it" },
            { name: "Japão", code: "jp" },
            { name: "China", code: "cn" },
            { name: "Rússia", code: "ru" },
            { name: "Austrália", code: "au" },
            { name: "Coreia do Sul", code: "kr" },
            { name: "Índia", code: "in" },
            { name: "Argentina", code: "ar" },
            { name: "México", code: "mx" },
            { name: "Espanha", code: "es" },
            { name: "Suíça", code: "ch" },
            { name: "Suécia", code: "se" },
            { name: "Noruega", code: "no" },
            { name: "Finlândia", code: "fi" },
            { name: "Dinamarca", code: "dk" },
            { name: "África do Sul", code: "za" },
            { name: "Israel", code: "il" },
            { name: "Turquia", code: "tr" },
            { name: "Ucrânia", code: "ua" },
            { name: "Holanda", code: "nl" },
            { name: "Bélgica", code: "be" },
            { name: "Uruguai", code: "uy" },
            { name: "Paraguai", code: "py" },
            { name: "Chile", code: "cl" },
            { name: "Colômbia", code: "co" },
            { name: "Peru", code: "pe" },
            { name: "Egito", code: "eg" },
            { name: "Marrocos", code: "ma" },
            { name: "Nigéria", code: "ng" },
            { name: "Arábia Saudita", code: "sa" },
            { name: "Emirados Árabes", code: "ae" },
            { name: "Grécia", code: "gr" },
            { name: "Polônia", code: "pl" },
            { name: "Irlanda", code: "ie" },
            { name: "Nova Zelândia", code: "nz" },
            { name: "Tailândia", code: "th" },
            { name: "Vietnã", code: "vn" },
            { name: "Indonésia", code: "id" }
        ];

        let correctCountry;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('vg_best_bandeiras') || '0');
        document.getElementById('best-score').innerText = bestScore;

        function startGame() {
            correctCountry = allCountries[Math.floor(Math.random() * allCountries.length)];
            
            let options = [correctCountry];
            while (options.length < 4) {
                let random = allCountries[Math.floor(Math.random() * allCountries.length)];
                if (!options.some(o => o.code === random.code)) {
                    options.push(random);
                }
            }

            options.sort(() => Math.random() - 0.5);

            // Carrega a bandeira prioritariamente do diretório local rápido (/assets/flags/) com fallback
            const imgEl = document.getElementById("flag-img");
            imgEl.src = `/assets/flags/${correctCountry.code}.svg`;
            imgEl.onerror = () => {
                // Fallback para CDN caso esteja em ambiente que ainda não copiou o asset
                imgEl.src = `https://flagcdn.com/w320/${correctCountry.code}.png`;
            };
            
            const grid = document.getElementById("options-grid");
            grid.innerHTML = "";
            
            const feedback = document.getElementById("feedback");
            feedback.innerText = "Escolha a resposta correta:";
            feedback.className = "h-6 mt-3 text-xs font-mono uppercase tracking-wider text-slate-500";

            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "bg-slate-900/90 border border-white/10 hover:border-amber-400 hover:bg-slate-800/90 py-3.5 px-4 rounded-xl font-heading font-semibold transition shadow-md text-sm leading-tight active:scale-98 text-slate-200 text-left flex items-center justify-between group";
                btn.innerHTML = `
                    <span>${opt.name}</span>
                    <i class="ph-bold ph-caret-right text-slate-600 group-hover:text-amber-400 transition"></i>
                `;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const feedback = document.getElementById("feedback");
            const allBtns = document.getElementById("options-grid").querySelectorAll("button");
            
            allBtns.forEach(b => b.disabled = true);

            if (selected.code === correctCountry.code) {
                // Acerto
                btn.classList.remove("bg-slate-900/90", "border-white/10");
                btn.classList.add("bg-emerald-500/20", "border-emerald-500", "text-emerald-300");
                
                feedback.innerText = "✓ Correto! Alvo confirmado!";
                feedback.className = "h-6 mt-3 text-xs font-mono font-bold uppercase tracking-wider text-emerald-400 animate-pulse";
                
                score++;
                document.getElementById("score").innerText = score;

                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('vg_best_bandeiras', bestScore);
                    document.getElementById('best-score').innerText = bestScore;
                }

                // Explosão de confetes a cada 5 acertos seguidos
                if (score % 5 === 0 && typeof confetti === 'function') {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                }

                setTimeout(startGame, 600);
            } else {
                // Erro
                btn.classList.remove("bg-slate-900/90", "border-white/10");
                btn.classList.add("bg-red-500/20", "border-red-500", "text-red-300");
                
                feedback.innerText = `✗ Errado! Era: ${correctCountry.name}`;
                feedback.className = "h-6 mt-3 text-xs font-mono font-bold uppercase tracking-wider text-red-400";
                
                allBtns.forEach(b => {
                    if (b.innerText.trim().includes(correctCountry.name)) {
                        b.classList.add("border-emerald-500", "text-emerald-400", "border-2");
                    }
                });
                
                score = 0;
                document.getElementById("score").innerText = score;
                setTimeout(startGame, 1800);
            }
        }

        // Alternar modo Tela Cheia nativo
        function alternarTelaCheia() {
            const container = document.getElementById("game-stage-container") || document.documentElement;
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        startGame();
    </script>
</body>
</html>
